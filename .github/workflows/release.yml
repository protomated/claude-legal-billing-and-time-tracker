name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - run: npm ci

      - run: npm run build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            legal-billing-time-tracker-v${{ steps.version.outputs.VERSION }}.mcpb \
            legal-billing-time-tracker-v${{ steps.version.outputs.VERSION }}.mcpb.sha256 \
            --title "Legal Billing and Time Tracker ${{ github.ref_name }}" \
            --notes-file RELEASE.md
